name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ricky9w/freesound-org-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use npm with OIDC support
        run: npm install --global npm@12.0.2
      - name: Verify tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== "v" + p.version) throw new Error("Tag and package version differ");'
      - run: npm ci
      - run: npm run check
      - uses: oven-sh/setup-bun@v2
      - name: Check packaged Node and Bun entrypoints
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/packed"
          npm install --prefix "$RUNNER_TEMP/packed" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/freesound-org-cli-"*.tgz
          test "$(node "$RUNNER_TEMP/packed/node_modules/freesound-org-cli/dist/index.js" --version)" = "${GITHUB_REF_NAME#v}"
          test "$(bun "$RUNNER_TEMP/packed/node_modules/freesound-org-cli/dist/index.js" --version)" = "${GITHUB_REF_NAME#v}"
          bun "$RUNNER_TEMP/packed/node_modules/freesound-org-cli/dist/index.js" doctor --json
      - name: Publish with OIDC and provenance
        run: npm publish --access public --provenance --ignore-scripts
